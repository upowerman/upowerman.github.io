name: Deploy DevHub to GitHub Pages

on:
  push:
    branches:
      - main
      - feature/devhub
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build-and-deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run tests
        run: npm run test:run

      - name: Build static site
        run: npm run build

      - name: Ensure CNAME exists
        run: cp public/CNAME dist/CNAME

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Ping IndexNow (Bing & Search Engines)
        continue-on-error: true
        run: |
          curl -s -X POST https://api.indexnow.org/indexnow \
            -H 'Content-Type: application/json; charset=utf-8' \
            -d '{
              "host": "yunitytech.top",
              "key": "a6c429d2975949509df659b85c1894d8",
              "keyLocation": "https://yunitytech.top/a6c429d2975949509df659b85c1894d8.txt",
              "urlList": [
                "https://yunitytech.top/",
                "https://yunitytech.top/tools/json/",
                "https://yunitytech.top/tools/timestamp/",
                "https://yunitytech.top/tools/jwt/",
                "https://yunitytech.top/tools/codec/",
                "https://yunitytech.top/tools/regex/",
                "https://yunitytech.top/tools/cron/",
                "https://yunitytech.top/tools/uuid/",
                "https://yunitytech.top/tools/color/",
                "https://yunitytech.top/tools/aes/",
                "https://yunitytech.top/tools/case/",
                "https://yunitytech.top/tools/sql/",
                "https://yunitytech.top/tools/curl/",
                "https://yunitytech.top/tools/diff/",
                "https://yunitytech.top/tools/json-to-type/"
              ]
            }'
