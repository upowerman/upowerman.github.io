<!DOCTYPE html>
<html lang="zh-CN" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>404 - 页面未找到 | DevHub 开发者工作台</title>
    <meta name="robots" content="noindex, follow" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <style>
      *, *::before, *::after {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        background-color: #020617;
        color: #f8fafc;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 24px;
        line-height: 1.6;
      }
      .card {
        max-width: 640px;
        width: 100%;
        background-color: #0f172a;
        border: 1px solid #1e293b;
        border-radius: 20px;
        padding: 40px 32px;
        text-align: center;
        box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      }
      .badge {
        display: inline-block;
        padding: 4px 12px;
        border-radius: 9999px;
        font-size: 12px;
        font-weight: 700;
        background-color: rgba(239, 68, 68, 0.15);
        color: #f87171;
        margin-bottom: 16px;
      }
      h1 {
        font-size: 32px;
        font-weight: 800;
        color: #ffffff;
        margin-bottom: 12px;
      }
      p.subtitle {
        font-size: 15px;
        color: #94a3b8;
        margin-bottom: 28px;
      }
      .btn-home {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #16a34a, #22c55e);
        color: #ffffff;
        font-weight: 600;
        font-size: 15px;
        padding: 12px 28px;
        border-radius: 12px;
        text-decoration: none;
        transition: opacity 0.2s;
        box-shadow: 0 4px 12px rgba(34, 197, 94, 0.3);
      }
      .btn-home:hover {
        opacity: 0.9;
      }
      .tools-title {
        font-size: 13px;
        font-weight: 600;
        color: #64748b;
        text-transform: uppercase;
        letter-spacing: 0.05em;
        margin: 32px 0 16px;
        border-top: 1px solid #1e293b;
        padding-top: 24px;
      }
      .tools-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
        gap: 10px;
        margin-bottom: 24px;
      }
      .tool-link {
        display: block;
        padding: 10px;
        background-color: #1e293b;
        color: #cbd5e1;
        font-size: 13px;
        font-weight: 500;
        border-radius: 10px;
        text-decoration: none;
        transition: all 0.2s;
        border: 1px solid transparent;
      }
      .tool-link:hover {
        background-color: #334155;
        color: #4ade80;
        border-color: #16a34a;
      }
      .timer {
        font-size: 12px;
        color: #64748b;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <div class="badge">HTTP 404 NOT FOUND</div>
      <h1>抱歉，页面未找到</h1>
      <p class="subtitle">您访问的链接可能已失效、被移动，或输入的网址有误。</p>
      
      <a href="/" class="btn-home">返回 DevHub 首页</a>

      <div class="tools-title">常用纯前端离线开发者工具</div>
      <div class="tools-grid">
        <a href="/tools/json/" class="tool-link">JSON 实验室</a>
        <a href="/tools/timestamp/" class="tool-link">时间戳转换器</a>
        <a href="/tools/jwt/" class="tool-link">JWT 解码器</a>
        <a href="/tools/codec/" class="tool-link">编解码与哈希</a>
        <a href="/tools/regex/" class="tool-link">正则测试速查</a>
        <a href="/tools/cron/" class="tool-link">Cron 表达式</a>
        <a href="/tools/uuid/" class="tool-link">UUID 生成器</a>
      </div>

      <div class="timer" id="countdown">
        将在 <span id="sec">5</span> 秒后自动返回首页...
      </div>
    </div>

    <script>
      let seconds = 5;
      const secEl = document.getElementById('sec');
      const interval = setInterval(function() {
        seconds--;
        if (secEl) secEl.textContent = seconds;
        if (seconds <= 0) {
          clearInterval(interval);
          window.location.href = '/';
        }
      }, 1000);
    </script>
  </body>
</html>
